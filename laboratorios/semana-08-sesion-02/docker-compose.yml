services:
  eda:
    build: .
    container_name: eda-taxis
    command: python3 EDA.py
    working_dir: /app/starter
    volumes:
      - ./data-contenedor:/app/starter/figuras

  explorar-relaciones:
    build: .
    container_name: relaciones-taxis
    command: python3 explorar_relaciones.py
    working_dir: /app/plantilla-ejercicio2
    volumes:
      - ./data-contenedor:/app/plantilla-ejercicio2/figuras

  proyecto:
    build: .
    container_name: eda-proyecto
    command: python3 explorar_proyecto.py
    working_dir: /app/plantilla-eda
    volumes:
      - ./data-contenedor:/app/plantilla-eda/figuras